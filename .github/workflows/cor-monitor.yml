name: Council on Revenues monitor

# Watches https://tax.hawaii.gov/useful/a9_1cor/ for new revenue forecasts.
#
# The COR reports to the governor and legislature on statutory dates (June 1,
# September 10, January 10, March 15 for the general fund; August 5 and
# November 5 for total personal income), so roughly five times a year there is
# real news and the rest of the time there is none. This runs weekly rather than
# monthly because those dates don't line up with month-end — July 30 and
# September 3 meetings are five weeks apart — and a quiet run costs seconds.
#
# On a change: the new forecast is downloaded and text-extracted, Claude writes
# a summary comparing it to the forecast it supersedes, everything is committed,
# and an issue is opened (which GitHub emails to watchers).

on:
  schedule:
    - cron: "0 17 * * 1"   # Mondays 17:00 UTC = 07:00 HST
  workflow_dispatch:
    inputs:
      force_narrative:
        description: "Summarize the latest forecast even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  id-token: write

concurrency:
  group: cor-monitor
  cancel-in-progress: false

env:
  # Date the CLAUDE_CODE_OAUTH_TOKEN secret was generated with `claude setup-token`.
  # These tokens last one year and cannot be renewed automatically — the flow is
  # an interactive browser login. Update this line whenever you regenerate the
  # token; the "token expiry" job below warns 30 days out so it never lapses
  # silently. Set to "unknown" to disable the warning.
  TOKEN_ISSUED: "2026-08-18"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.monitor.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pdfplumber

      - name: Check the COR page
        id: monitor
        run: |
          set +e
          python3 scripts/cor_monitor.py
          code=$?
          set -e
          case "$code" in
            0)  echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            10) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            # Exit 1 means the fetch failed or the page markup changed enough
            # that we parsed nothing. Fail the run — a monitor that silently
            # stops noticing is the failure mode this whole job exists to avoid.
            *)  echo "::error::cor_monitor.py failed (exit $code)"; exit 1 ;;
          esac

      - name: Summarize what changed
        if: steps.monitor.outputs.changed == 'true' || inputs.force_narrative
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Write,Glob,Bash(ls:*),Bash(cat:*),Bash(git status:*)" --max-turns 15'
          show_full_output: true
          prompt: |
            A change was detected on the Hawaii Council on Revenues page.

            Read the newest change packet in data/raw/cor/changes/ (the file with
            the most recent date in its name). It contains the list of new
            documents plus the extracted text of any new forecast alongside the
            forecast it supersedes.

            Write a summary to data/raw/cor/changes/<same-date>-cor-summary.md
            aimed at a budget analyst at Hawaii Appleseed who already knows how
            the state budget works. Cover:

            1. What the Council actually did — the revised growth rates by fiscal
               year, stated as "from X% to Y%", and which years were left alone.
            2. The reasons the Council gave, in their words, condensed.
            3. What it implies for the general fund in dollar terms if the
               documents give enough to say so. If they do not, say that plainly
               rather than estimating.
            4. Anything relevant to the Budget Primer's published figures — a
               changed out-year growth rate matters for the six-year plan.

            Lead with the single most important sentence. Be specific and use the
            real numbers. If the change was only administrative — draft minutes
            finalized, a video posted, a meeting notice — say so in two lines and
            stop; do not manufacture significance.

            Write only that one file. Do not commit; a later step handles that.

      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "cor-monitor[bot]"
          git config user.email "cor-monitor@users.noreply.github.com"
          # The claude-code-action step above swaps in its own GitHub App
          # installation token for the duration of its run and revokes it
          # afterward, which leaves origin's credentials pointing at a dead
          # token. Re-point at the standard Actions token before pushing.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add -A data/raw/cor
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          if [ "${{ steps.monitor.outputs.changed }}" = "true" ]; then
            git commit -m "COR: new material detected $(date -u +%Y-%m-%d)"
          else
            # The heartbeat commit is not busywork: GitHub disables scheduled
            # workflows in repos with 60 days of no activity, and the COR is
            # quiet for months at a time.
            git commit -m "COR: checked $(date -u +%Y-%m-%d), no change"
          fi
          git pull --rebase --autostash origin main || true
          git push origin HEAD:main

      - name: Open an issue
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%Y-%m-%d)
          summary="data/raw/cor/changes/${today}-cor-summary.md"
          packet="data/raw/cor/changes/${today}-cor-change.md"
          body=$(mktemp)
          if [ -f "$summary" ]; then
            cat "$summary" >> "$body"
          else
            # No narrative means the Claude step failed or was skipped. The
            # packet still holds the new documents and extracted figures, so the
            # issue is worth opening either way.
            echo "_No narrative was generated this run — the raw change packet is below._" >> "$body"
            echo >> "$body"
            head -c 40000 "$packet" >> "$body"
          fi
          printf '\n\n---\nSource: https://tax.hawaii.gov/useful/a9_1cor/\nPacket: `%s`\n' "$packet" >> "$body"
          gh issue create \
            --title "Council on Revenues update — ${today}" \
            --body-file "$body" \
            --label "cor-update" || \
          gh issue create \
            --title "Council on Revenues update — ${today}" \
            --body-file "$body"

  token-expiry:
    # Separate job so a token problem is reported even when the check job fails.
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Warn before the OAuth token expires
        if: env.TOKEN_ISSUED != 'unknown'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          issued=$(date -u -d "$TOKEN_ISSUED" +%s 2>/dev/null) || exit 0
          age_days=$(( ( $(date -u +%s) - issued ) / 86400 ))
          left=$(( 365 - age_days ))
          echo "token is ${age_days} days old; ~${left} days until it expires"
          if [ "$left" -gt 30 ]; then
            exit 0
          fi
          # One open reminder at a time, not one a week for the last month.
          open=$(gh issue list --repo "$REPO" --state open \
                   --search "Claude token expires in:title" --json number \
                   --jq 'length')
          if [ "${open:-0}" != "0" ]; then
            echo "reminder already open"
            exit 0
          fi
          gh issue create --repo "$REPO" \
            --title "Claude token expires in ~${left} days — regenerate it" \
            --body "$(printf '%s\n' \
              "The \`CLAUDE_CODE_OAUTH_TOKEN\` secret used by the Council on Revenues monitor was generated on ${TOKEN_ISSUED} and lasts one year. These tokens cannot be renewed automatically — the flow requires an interactive browser login." \
              "" \
              "To renew:" \
              "" \
              '1. Run `claude setup-token` locally and copy the token.' \
              "2. Update the \`CLAUDE_CODE_OAUTH_TOKEN\` secret in this repo's settings." \
              '3. Set `TOKEN_ISSUED` in `.github/workflows/cor-monitor.yml` to today.' \
              "" \
              "If this lapses, the weekly check keeps running and still archives new forecasts — only the written summary stops.")"
